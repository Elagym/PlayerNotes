<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Alegreya+Sans:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 700px 500px at 300px 320px, rgba(80,140,255,.28), transparent 70%),
      radial-gradient(ellipse 900px 600px at 900px 300px, rgba(130,90,200,.18), transparent 70%),
      linear-gradient(160deg, #1a2440 0%, #0d1324 60%, #070a14 100%);
    font-family: 'Alegreya Sans', 'Segoe UI', sans-serif;
    position: relative;
  }
  .frame { position: absolute; inset: 18px; border: 2px solid rgba(233,191,98,.55); border-radius: 22px; box-shadow: inset 0 0 0 6px rgba(233,191,98,.08); }
  .stars { position: absolute; inset: 0; background-image:
      radial-gradient(1.5px 1.5px at 120px 90px, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 620px 70px, #cfe3ff, transparent),
      radial-gradient(1.2px 1.2px at 1180px 120px, #cfe3ff, transparent),
      radial-gradient(1.2px 1.2px at 1040px 560px, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 560px 580px, #cfe3ff, transparent),
      radial-gradient(1.2px 1.2px at 80px 560px, #cfe3ff, transparent),
      radial-gradient(1.2px 1.2px at 1220px 380px, #cfe3ff, transparent);
    opacity: .8; }
  img { position: absolute; left: 90px; top: 110px; width: 420px; height: 420px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
  .text { position: absolute; left: 560px; top: 168px; right: 60px; }
  h1 { margin: 0; font-family: 'Cinzel', Georgia, serif; font-weight: 900; font-size: 86px; line-height: 1; letter-spacing: 0; white-space: nowrap;
       background: linear-gradient(180deg, #fff0c2 0%, #f0c665 45%, #b07a26 75%, #f3d27e 100%);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0 4px 0 #3b2408) drop-shadow(0 10px 18px rgba(0,0,0,.6)); }
  p { margin: 26px 0 0; color: #dfe6f5; font-size: 36px; font-weight: 500; line-height: 1.25; }
  .chips { margin-top: 38px; display: flex; gap: 16px; }
  .chip { font-weight: 700; font-size: 26px; padding: 8px 22px; border-radius: 999px; border: 2px solid; background: rgba(0,0,0,.25); }
  .bad { color: #ff7a6e; border-color: #ff5050; }
  .good { color: #6ef08a; border-color: #40ff40; }
  .mixed { color: #ffd86a; border-color: #ffd040; }
</style></head>
<body>
  <div class="stars"></div>
  <div class="frame"></div>
  <img src="logo.svg" alt="">
  <div class="text">
    <h1>PlayerNotes</h1>
    <p>Private notes on the players you meet,<br>and a reminder when you meet them again.</p>
    <div class="chips"><span class="chip bad">Caution</span><span class="chip good">Good</span><span class="chip mixed">Mixed</span></div>
  </div>
</body></html>
